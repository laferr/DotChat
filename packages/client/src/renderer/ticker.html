<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      /* 전광판 바 — 흐르는 항목이 있을 때만 나타남 */
      #bar {
        position: absolute;
        inset: 0;
        background: rgba(9, 9, 14, 0.85);
        border-bottom: 1px solid rgba(255, 214, 110, 0.3);
        opacity: 0;
        transition: opacity 0.45s;
        overflow: hidden;
      }
      #bar.show {
        opacity: 1;
      }
      .tk-run {
        position: absolute;
        top: 50%;
        left: 0;
        white-space: nowrap;
        font: 700 17px 'Segoe UI', 'Malgun Gothic', sans-serif;
        letter-spacing: 0.3px;
        text-shadow: 0 0 6px currentColor;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <script src="../../dist/renderer/composer.js"></script>
    <script src="../../dist/renderer/ticker.js"></script>
  </body>
</html>
