<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:" />
    <style>
      :root {
        --accent: #d94f63;
        --accent-hover: hsl(351 64% 66%);
        --header: hsl(351 30% 25%);
        --header-hover: hsl(351 30% 34%);
        --self-bubble: hsl(351 25% 32%);
        --bg: hsl(351 12% 16%);
        --bg-input: hsl(351 14% 12%);
        --bubble-other: hsl(351 10% 23%);
        --text: hsl(351 15% 92%);
        --text-dim: hsl(351 10% 55%);
        --nick: hsl(351 55% 75%);
        --nick-self: hsl(36 65% 72%);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        font-size: 13px;
      }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--header);
        border-radius: 10px;
      }
      header {
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: var(--header);
        border-radius: 9px 9px 0 0;
        user-select: none;
      }
      header .title {
        font-weight: 700;
        color: #fffdf7;
      }
      header .online {
        font-size: 11px;
        color: var(--nick);
      }
      header .spacer {
        flex: 1;
      }
      header button {
        -webkit-app-region: no-drag;
        border: 0;
        background: transparent;
        color: var(--text);
        font-size: 14px;
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 5px;
      }
      header button:hover {
        background: var(--header-hover);
      }
      #update-bell {
        position: relative;
        animation: bell-wiggle 2.4s ease-in-out infinite;
      }
      #update-bell::after {
        content: '';
        position: absolute;
        top: 2px;
        right: 4px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff5a5a;
        border: 1px solid #fffdf7;
      }
      @keyframes bell-wiggle {
        0%, 84%, 100% { transform: rotate(0deg); }
        88% { transform: rotate(14deg); }
        92% { transform: rotate(-12deg); }
        96% { transform: rotate(8deg); }
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #messages::-webkit-scrollbar {
        width: 8px;
      }
      #messages::-webkit-scrollbar-thumb {
        background: var(--header);
        border-radius: 4px;
      }
      .msg {
        display: flex;
        gap: 6px;
        align-items: flex-start;
      }
      .msg.self {
        flex-direction: row-reverse; /* 본인: 아바타 오른쪽 + 우측 정렬 */
      }
      .msg .avatar {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--bubble-other);
        image-rendering: pixelated;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .msg .content {
        display: flex;
        flex-direction: column;
        max-width: 84%;
      }
      .msg.self .content {
        align-items: flex-end;
      }
      .msg .meta {
        display: flex;
        gap: 6px;
        align-items: baseline;
        margin-bottom: 2px;
      }
      .msg .nick {
        font-size: 12px;
        font-weight: 700;
        color: var(--nick);
      }
      .msg.self .nick {
        color: var(--nick-self);
      }
      .msg .time {
        font-size: 10px;
        color: var(--text-dim);
      }
      .msg .text {
        background: var(--bubble-other);
        border-radius: 8px;
        padding: 6px 10px;
        width: fit-content;
        max-width: 100%;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.4;
      }
      .msg.self .text {
        background: var(--self-bubble);
      }
      .bubble-row {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        max-width: 100%;
      }
      .read-count {
        font-size: 10px;
        font-weight: 700;
        color: #ffd66e;
        padding-bottom: 2px;
        flex-shrink: 0;
      }
      .sysmsg {
        text-align: center;
        font-size: 11px;
        color: var(--text-dim);
      }
      footer {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--header);
      }
      #chat-input {
        flex: 1;
        border: 1px solid var(--header);
        background: var(--bg-input);
        color: var(--text);
        border-radius: 7px;
        padding: 8px 10px;
        font-size: 13px;
        outline: none;
      }
      #chat-input:focus {
        border-color: var(--accent);
      }
      #send-btn {
        border: 0;
        background: var(--accent);
        color: #fffdf7;
        font-weight: 700;
        border-radius: 7px;
        padding: 0 14px;
        cursor: pointer;
      }
      #send-btn:hover {
        background: var(--accent-hover);
      }
      #send-btn:disabled {
        background: #6b5b64;
        cursor: default;
      }
      #img-btn {
        border: 0;
        background: var(--bubble-other);
        color: var(--text);
        border-radius: 7px;
        padding: 0 10px;
        cursor: pointer;
        font-size: 14px;
      }
      #img-btn:hover:enabled {
        background: var(--header-hover);
      }
      #img-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .msg-image {
        display: block;
        max-width: 180px;
        max-height: 140px;
        border-radius: 6px;
        cursor: zoom-in;
      }
      #appearance-panel,
      #options-panel {
        position: absolute;
        left: 0;
        right: 0;
        top: 41px;
        bottom: 55px;
        display: none;
        flex-direction: column;
        background: var(--bg-input);
        border-top: 1px solid var(--header);
        z-index: 5;
      }
      #appearance-panel.open,
      #options-panel.open {
        display: flex;
      }
      .options-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 4px 14px;
      }
      .options-body label {
        font-size: 12px;
        color: var(--nick);
        font-weight: 700;
      }
      #opacity-val {
        color: var(--text);
      }
      #opacity-slider {
        width: 100%;
        accent-color: var(--accent);
      }
      .options-body .hint {
        font-size: 11px;
        color: var(--text-dim);
        line-height: 1.5;
        margin: 0;
      }
      #scale-btns {
        display: flex;
        gap: 6px;
      }
      #scale-btns button {
        flex: 1;
        border: 1px solid var(--header);
        background: var(--bg);
        color: var(--text);
        border-radius: 6px;
        padding: 6px 0;
        cursor: pointer;
        font-weight: 700;
      }
      #scale-btns button:hover {
        border-color: var(--accent);
      }
      #scale-btns button.active {
        background: var(--self-bubble);
        border-color: var(--accent);
      }
      #color-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #color-swatches {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .swatch {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
      }
      .swatch.active {
        border-color: #fffdf7;
      }
      #chat-color {
        width: 30px;
        height: 26px;
        border: 1px solid var(--header);
        border-radius: 6px;
        background: var(--bg-input);
        padding: 2px;
        cursor: pointer;
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        font-weight: 700;
        color: var(--nick);
      }
      .panel-head button {
        border: 0;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        border-radius: 5px;
        padding: 2px 8px;
      }
      .panel-head button:hover {
        background: var(--header-hover);
      }
      #owned-count {
        color: var(--text-dim);
        font-weight: 400;
        font-size: 11px;
      }
      #slot-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 0 12px 8px;
      }
      .slot-tab {
        border: 1px solid var(--header);
        background: var(--bg);
        color: var(--text);
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 11px;
        cursor: pointer;
      }
      .slot-tab:hover {
        border-color: var(--accent);
      }
      .slot-tab.active {
        background: var(--self-bubble);
        border-color: var(--accent);
        font-weight: 700;
      }
      #hsv-controls {
        display: flex;
        gap: 10px;
        padding: 0 12px 8px;
      }
      #hsv-controls label {
        flex: 1;
        font-size: 10px;
        color: var(--text-dim);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #hsv-controls input {
        width: 100%;
        accent-color: var(--accent);
      }
      #hsv-controls input:disabled {
        opacity: 0.35;
      }
      #char-grid {
        flex: 1;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
        gap: 8px;
        padding: 0 12px 12px;
        align-content: start;
      }
      #char-grid::-webkit-scrollbar {
        width: 8px;
      }
      #char-grid::-webkit-scrollbar-thumb {
        background: var(--header);
        border-radius: 4px;
      }
      .char-cell {
        border: 2px solid var(--header);
        background: var(--bg);
        border-radius: 8px;
        padding: 6px 0 3px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .char-cell:hover {
        border-color: var(--accent);
      }
      .char-cell.current {
        border-color: #ffd66e;
      }
      .char-cell canvas {
        width: 36px;
        height: 36px;
        image-rendering: pixelated;
      }
      .char-cell .cname {
        font-size: 9px;
        color: var(--text-dim);
        max-width: 56px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .char-cell.remove-cell {
        justify-content: center;
        font-size: 18px;
        color: var(--text-dim);
        min-height: 56px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="title">DotChat</span>
      <span class="online" id="online">접속 확인 중…</span>
      <span class="spacer"></span>
      <button id="update-bell" title="새 업데이트" hidden>🔔</button>
      <button id="appearance-btn" title="외모 변경">👕</button>
      <button id="options-btn" title="옵션">⚙️</button>
      <button id="close-btn" title="닫기">✕</button>
    </header>
    <div id="options-panel">
      <div class="panel-head">
        <span>옵션</span>
        <button id="options-close">✕</button>
      </div>
      <div class="options-body">
        <label for="opacity-slider">콘텐츠 투명도 <span id="opacity-val"></span></label>
        <input id="opacity-slider" type="range" min="10" max="100" step="5" />
        <p class="hint">작업표시줄 위 캐릭터·말풍선·버튼의 투명도입니다. (최소 10%)</p>
        <label>표시 크기</label>
        <div id="scale-btns">
          <button data-scale="1">x1</button>
          <button data-scale="2">x2</button>
          <button data-scale="3">x3</button>
        </div>
        <p class="hint">캐릭터 표시 배율입니다. (원본 64px 기준)</p>
        <label>채팅창 테마 색상</label>
        <div id="color-row">
          <div id="color-swatches"></div>
          <input id="chat-color" type="color" title="직접 선택" />
        </div>
      </div>
    </div>
    <div id="appearance-panel">
      <div class="panel-head">
        <span>외모 변경 <span id="owned-count"></span></span>
        <button id="panel-close">✕</button>
      </div>
      <div id="slot-tabs"></div>
      <div id="hsv-controls">
        <label>색조 <input id="hsv-h" type="range" min="-180" max="180" step="5" /></label>
        <label>채도 <input id="hsv-s" type="range" min="-100" max="100" step="5" /></label>
        <label>명도 <input id="hsv-v" type="range" min="-100" max="100" step="5" /></label>
      </div>
      <div id="char-grid"></div>
    </div>
    <div id="messages"></div>
    <footer>
      <button id="img-btn" title="이미지 전송 (Ctrl+V로 붙여넣기도 가능)">📎</button>
      <input id="img-input" type="file" accept="image/png,image/jpeg,image/webp" hidden />
      <input id="chat-input" maxlength="200" placeholder="메시지 입력 후 Enter" autocomplete="off" />
      <button id="send-btn">전송</button>
    </footer>
    <script src="../../dist/renderer/composer.js"></script>
    <script src="../../dist/renderer/chat.js"></script>
  </body>
</html>
