<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        font-size: 13px;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #2b2230;
        color: #f0e8ec;
        border: 1px solid #4a2837;
        border-radius: 10px;
      }
      header {
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        padding: 10px 12px;
        background: #4a2837;
        border-radius: 9px 9px 0 0;
        user-select: none;
      }
      header .title {
        font-weight: 700;
        color: #fffdf7;
        flex: 1;
      }
      header button {
        -webkit-app-region: no-drag;
        border: 0;
        background: transparent;
        color: #f0e8ec;
        font-size: 14px;
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 5px;
      }
      header button:hover {
        background: #6b3b52;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
      }
      label {
        font-size: 12px;
        color: #f2a6b4;
        font-weight: 700;
      }
      input {
        border: 1px solid #4a2837;
        background: #221a26;
        color: #f0e8ec;
        border-radius: 7px;
        padding: 9px 10px;
        font-size: 13px;
        outline: none;
        width: 100%;
      }
      input:focus {
        border-color: #d94f63;
      }
      .hint {
        font-size: 11px;
        color: #8d7d88;
        line-height: 1.5;
        margin: 0;
      }
      #error {
        font-size: 11px;
        color: #ff8d9d;
        min-height: 14px;
      }
      #start-btn {
        border: 0;
        background: #d94f63;
        color: #fffdf7;
        font-weight: 700;
        border-radius: 7px;
        padding: 10px;
        cursor: pointer;
        font-size: 14px;
      }
      #start-btn:hover:enabled {
        background: #e86a7c;
      }
      #start-btn:disabled {
        background: #6b5b64;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="title">DotChat 시작하기</span>
      <button id="close-btn" title="닫기">✕</button>
    </header>
    <main>
      <div>
        <label for="nick-input">닉네임</label>
        <input id="nick-input" maxlength="16" placeholder="예: airpass" autocomplete="off" />
      </div>
      <div>
        <label for="tag-input">고유번호 (숫자 4자리)</label>
        <input id="tag-input" maxlength="4" inputmode="numeric" placeholder="예: 0424" autocomplete="off" />
      </div>
      <p class="hint">
        닉네임#고유번호 조합으로 사용자를 구분합니다.<br />
        같은 닉네임이라도 번호가 다르면 다른 사용자예요.
      </p>
      <div id="error"></div>
      <button id="start-btn" disabled>시작하기</button>
    </main>
    <script src="../../dist/renderer/setup.js"></script>
  </body>
</html>
