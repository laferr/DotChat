<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 532px;
        height: 316px;
        overflow: hidden;
        font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        background: transparent;
      }
      #count {
        position: absolute;
        left: 10px;
        top: 0;
        height: 20px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 10px;
        background: #4a2837;
        color: #fffdf7;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid #fffdf7;
        border-radius: 10px;
        user-select: none;
      }
      #close-btn {
        position: absolute;
        right: 10px;
        top: 0;
        width: 26px;
        height: 20px;
        border: 1px solid #fffdf7;
        background: #4a2837;
        color: #fffdf7;
        font-size: 11px;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
        line-height: 1;
      }
      #close-btn:hover {
        background: #a23352;
      }
      /* 책장 넘기기 (도감이 여러 스프레드로 늘어남) */
      #nav {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        height: 20px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 6px;
        background: #4a2837;
        border: 1px solid #fffdf7;
        border-radius: 10px;
        color: #fffdf7;
        font-size: 11px;
        font-weight: 700;
        user-select: none;
      }
      #nav button {
        border: 0;
        background: transparent;
        color: #fffdf7;
        font-size: 11px;
        cursor: pointer;
        padding: 0 4px;
        line-height: 1;
      }
      #nav button:hover:enabled {
        color: #ffd66e;
      }
      #nav button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #book {
        -webkit-app-region: drag; /* 책을 잡고 드래그 이동 */
        position: absolute;
        left: 10px;
        top: 24px;
        width: 512px;
        height: 292px;
        image-rendering: pixelated;
      }
      .fish {
        -webkit-app-region: no-drag;
        position: absolute;
        width: 32px;
        height: 32px;
        image-rendering: pixelated;
      }
      .fish.uncaught {
        opacity: 0.5;
      }
      .fish.caught:hover {
        transform: scale(1.25);
      }
      #tooltip {
        position: absolute;
        display: none;
        padding: 3px 8px;
        background: #4a2837;
        color: #fffdf7;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid #fffdf7;
        border-radius: 8px;
        pointer-events: none;
        white-space: nowrap;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <span id="count"></span>
    <span id="nav"><button id="prev-btn">◀</button><span id="page-label"></span><button id="next-btn">▶</button></span>
    <button id="close-btn" title="닫기">✕</button>
    <div id="book"></div>
    <span id="tooltip"></span>
    <script src="../../dist/renderer/fishdex.js"></script>
  </body>
</html>
