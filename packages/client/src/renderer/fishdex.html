<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 532px;
        height: 316px;
        overflow: hidden;
        font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        background: transparent;
      }
      #count {
        position: absolute;
        left: 10px;
        top: 0;
        height: 20px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 10px;
        background: #4a2837;
        color: #fffdf7;
        font-size: 11px;
        font-weight: 700;
        border: 1px solid #fffdf7;
        border-radius: 10px;
        user-select: none;
      }
      #close-btn {
        position: absolute;
        right: 10px;
        top: 0;
        width: 26px;
        height: 20px;
        border: 1px solid #fffdf7;
        background: #4a2837;
        color: #fffdf7;
        font-size: 11px;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
        line-height: 1;
      }
      #close-btn:hover {
        background: #a23352;
      }
      #book {
        -webkit-app-region: drag; /* 책을 잡고 드래그 이동 */
        position: absolute;
        left: 10px;
        top: 24px;
        width: 512px;
        height: 292px;
        image-rendering: pixelated;
      }
      .fish {
        -webkit-app-region: no-drag;
        position: absolute;
        width: 32px;
        height: 32px;
        image-rendering: pixelated;
      }
      .fish.uncaught {
        opacity: 0.5;
      }
      .fish.caught:hover {
        transform: scale(1.25);
      }
    </style>
  </head>
  <body>
    <span id="count"></span>
    <button id="close-btn" title="닫기">✕</button>
    <div id="book"></div>
    <script src="../../dist/renderer/fishdex.js"></script>
  </body>
</html>
