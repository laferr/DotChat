<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 512px;
        height: 318px;
        overflow: hidden;
        font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        font-size: 13px;
        background: transparent;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #2b2230;
        color: #f0e8ec;
        border: 1px solid #4a2837;
        border-radius: 10px;
      }
      header {
        -webkit-app-region: drag;
        height: 26px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        background: #4a2837;
        border-radius: 9px 9px 0 0;
        user-select: none;
      }
      header .title {
        font-weight: 700;
        font-size: 12px;
        color: #fffdf7;
      }
      header .count {
        font-size: 11px;
        color: #f2a6b4;
      }
      header .spacer {
        flex: 1;
      }
      header button {
        -webkit-app-region: no-drag;
        border: 0;
        background: transparent;
        color: #f0e8ec;
        font-size: 13px;
        cursor: pointer;
        padding: 1px 7px;
        border-radius: 5px;
      }
      header button:hover {
        background: #6b3b52;
      }
      #book {
        position: relative;
        width: 512px;
        height: 292px;
        image-rendering: pixelated;
      }
      .fish {
        position: absolute;
        width: 32px;
        height: 32px;
        image-rendering: pixelated;
      }
      .fish.uncaught {
        opacity: 0.5;
      }
      .fish.caught:hover {
        transform: scale(1.25);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="title">📖 낚시도감</span>
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <button id="close-btn" title="닫기">✕</button>
    </header>
    <div id="book"></div>
    <script src="../../dist/renderer/fishdex.js"></script>
  </body>
</html>
