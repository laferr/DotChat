<!DOCTYPE html>
<!-- 낚시도감 브라우저 검증 하네스 — window.overlay를 스텁으로 채우고 실제 fishdex.js를 로드
     사용: node tools/serve.mjs 후 http://localhost:5317/tools/fishdex-harness.html -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>fishdex harness</title>
    <script>
      const toDataUrl = (blob) =>
        new Promise((resolve) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.readAsDataURL(blob);
        });
      window.overlay = {
        getExtras: () => fetch('/assets/extras/manifest-extras.json').then((r) => r.json()),
        loadExtra: (rel) =>
          fetch('/assets/extras/' + rel).then((r) => (r.ok ? r.blob().then(toDataUrl) : null)),
        // 잡은 물고기 샘플: 구 1종 + 새 3종 (box 포함) — 실루엣/컬러 대비 확인용
        getWallet: () => Promise.resolve({ fish: ['Clownfish', 'box', 'goldfish', 'Squidoom'] }),
        on: () => {},
        closeFishdex: () => {},
      };
    </script>
    <style>
      /* fishdex.html의 스타일 복제 (책 창 532x316) */
      * { box-sizing: border-box; }
      html, body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #666; }
      #frame { position: relative; width: 532px; height: 316px; overflow: hidden; }
      #count { position: absolute; left: 10px; top: 0; height: 20px; display: flex; align-items: center; gap: 4px; padding: 0 10px; background: #4a2837; color: #fffdf7; font-size: 11px; font-weight: 700; border: 1px solid #fffdf7; border-radius: 10px; }
      #close-btn { position: absolute; right: 10px; top: 0; width: 26px; height: 20px; border: 1px solid #fffdf7; background: #4a2837; color: #fffdf7; font-size: 11px; border-radius: 10px; cursor: pointer; }
      #nav { position: absolute; left: 50%; top: 0; transform: translateX(-50%); height: 20px; display: flex; align-items: center; gap: 6px; padding: 0 6px; background: #4a2837; border: 1px solid #fffdf7; border-radius: 10px; color: #fffdf7; font-size: 11px; font-weight: 700; }
      #nav button { border: 0; background: transparent; color: #fffdf7; font-size: 11px; cursor: pointer; padding: 0 4px; }
      #nav button:disabled { opacity: 0.35; }
      #book { position: absolute; left: 10px; top: 24px; width: 512px; height: 292px; image-rendering: pixelated; }
      .fish { position: absolute; width: 32px; height: 32px; image-rendering: pixelated; }
      .fish.uncaught { opacity: 0.5; }
      #tooltip { position: absolute; display: none; padding: 3px 8px; background: #4a2837; color: #fffdf7; font-size: 11px; border: 1px solid #fffdf7; border-radius: 8px; pointer-events: none; white-space: nowrap; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="frame">
      <span id="count"></span>
      <span id="nav"><button id="prev-btn">◀</button><span id="page-label"></span><button id="next-btn">▶</button></span>
      <button id="close-btn">✕</button>
      <div id="book"></div>
      <span id="tooltip"></span>
    </div>
    <script src="/packages/client/dist/renderer/fishdex.js"></script>
  </body>
</html>
